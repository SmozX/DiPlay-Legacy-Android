name: Software Opus fallback validation

on:
  push:
    branches:
      - fix/software-opus-fallback
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Prepare Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;25.2.9519653"

      - name: Restore MFi assets from Actions Secrets
        shell: bash
        env:
          MFI_IDENTITY_PK8_B64: ${{ secrets.MFI_IDENTITY_PK8_B64 }}
          MFI_CERTIFICATE_P7B_B64: ${{ secrets.MFI_CERTIFICATE_P7B_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "$MFI_IDENTITY_PK8_B64" || -z "$MFI_CERTIFICATE_P7B_B64" ]]; then
            echo "::error::Configure repository Actions secrets MFI_IDENTITY_PK8_B64 and MFI_CERTIFICATE_P7B_B64 before building a standalone APK."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/runtime-assets/offline-mfi"
          umask 077
          printf '%s' "$MFI_IDENTITY_PK8_B64" | base64 --decode > "$RUNNER_TEMP/runtime-assets/offline-mfi/identity.pk8"
          printf '%s' "$MFI_CERTIFICATE_P7B_B64" | base64 --decode > "$RUNNER_TEMP/runtime-assets/offline-mfi/certificate.p7b"
          test -s "$RUNNER_TEMP/runtime-assets/offline-mfi/identity.pk8"
          test -s "$RUNNER_TEMP/runtime-assets/offline-mfi/certificate.p7b"

      - name: Fetch pinned libopus source
        run: python3 scripts/prepare-libopus.py

      - name: Build standalone debug APK with MFi authentication
        env:
          DIPLAY_AUTH_ASSETS_DIR: ${{ runner.temp }}/runtime-assets
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :mobile:assembleStandaloneDebug

      - name: Run audio format regression test
        run: ./gradlew --no-daemon :shared:testDebugUnitTest --tests 'com.shilapi.xcertplay.airplay.AirPlayInfoPlistTest'

      - name: Run remaining unit tests (non-blocking diagnostic)
        continue-on-error: true
        run: |
          ./gradlew --no-daemon :common:testDebugUnitTest :shared:testDebugUnitTest

      - name: Verify software Opus library packaged
        run: unzip -l mobile/build/outputs/apk/debug/mobile-debug.apk | grep -q 'libopus_microphone.so'

      - name: Rename diagnostic APK
        shell: bash
        run: |
          mkdir -p dist
          cp mobile/build/outputs/apk/debug/mobile-debug.apk dist/DiPlay-software-opus-fallback-standalone-debug.apk

      - name: Upload APK and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: DiPlay-software-opus-fallback-standalone-mfi
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
